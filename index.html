<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSN Messenger 123 - Retro Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Pantalla de Login clásica -->
    <div class="login-screen" id="loginScreen">
        <div class="login-box">
            <div class="login-header">
                <h2>Messenger</h2>
            </div>
            <div class="login-body">
                <p>¿Cómo te querés llamar?</p>
                <input type="text" id="nombreInput" placeholder="Tu apodo..." autofocus>
                <button id="loginBtn">Iniciar sesión</button>
            </div>
        </div>
    </div>

    <!-- Ventana Principal del Chat (Oculta hasta iniciar sesión) -->
    <div class="msn-window hidden" id="msnWindow">
        <!-- Barra de título clásica -->
        <div class="msn-title-bar">
            <div class="title-left">
                <span class="msn-icon">🟢</span>
                <span>MSN Messenger - Ventana de Chat</span>
            </div>
            <div class="title-buttons">
                <button class="win-btn">🗕</button>
                <button class="win-btn">🗖</button>
                <button class="win-btn close">✕</button>
            </div>
        </div>

        <!-- Notificación emergente retro estilo MSN -->
        <div id="msnToast" class="msn-toast hidden">
            <div class="toast-avatar">👤</div>
            <div class="toast-content">
                <strong id="toastUser">Nombre</strong>
                <p id="toastMessage">Te ha enviado un mensaje...</p>
            </div>
        </div>

        <!-- Barra de perfil para celulares (solo se ve en pantallas chicas) -->
        <div class="mobile-profile-bar">
            <div class="mobile-status-container">
                <select id="statusSelectMobile" class="status-select">
                    <option value="online">🟢 En línea</option>
                    <option value="busy">🔴 Ocupado</option>
                    <option value="away">🟡 Ausente</option>
                </select>
            </div>
            <div class="mobile-substatus-container">
                <input type="text" id="personalMsgInputMobile" placeholder="Tu frase personal..." maxlength="60">
            </div>
        </div>

        <!-- Cuerpo principal: Contactos + Chat -->
        <div class="msn-body">
            
            <!-- Panel izquierdo: Contactos -->
            <div class="contact-panel">
                <div class="user-profile">
                    <div class="avatar-box">👨‍💻</div>
                    <div class="user-info">
                        <strong id="myDisplayName">Tu Nombre</strong>
                        <!-- Selector de Estado -->
                        <select id="statusSelect" class="status-select">
                            <option value="online">🟢 En línea</option>
                            <option value="busy">🔴 Ocupado</option>
                            <option value="away">🟡 Ausente</option>
                        </select>
                    </div>
                </div>
                <!-- Sub-estado / Frase personal editable -->
                <div class="personal-substatus-box">
                    <input type="text" id="personalMsgInput" placeholder="Haz clic aquí para cambiar tu frase personal..." maxlength="60">
                </div>
                <div class="contact-list-title">Contactos conectados</div>
                <ul class="contact-list" id="contactList">
                    <!-- Se llena dinámicamente -->
                </ul>
            </div>

            <!-- Panel derecho: Área de Chat -->
            <div class="chat-panel">
                <div class="chat-header">
                    <div class="chat-avatar">🤖</div>
                    <div>
                        <strong>Sala General / Amigos</strong>
                        <p class="personal-msg">"El futuro ya llegó..."</p>
                    </div>
                </div>

                <!-- Historial de mensajes -->
                <div class="chat-messages" id="chatMessages">
                    <div class="msg system">
                        <span><i>Bienvenido al chat del MSN Retro.</i></span>
                    </div>
                </div>

                <!-- Barra de herramientas -->
                <div class="chat-toolbar">
                    <button class="tool-btn" id="btnEmoticons" title="Emoticones">😊 Emoticons</button>
                    <button class="tool-btn" id="btnZumbido" title="¡Mandar un zumbido!">⚡ Zumbido!</button>
                
                    <!-- Menú desplegable de emoticones ampliado -->
<div class="emoticon-menu hidden" id="emoticonMenu">
    <button class="emo-btn" data-emo=":)">😊</button>
    <button class="emo-btn" data-emo=":D">😃</button>
    <button class="emo-btn" data-emo=";)">😉</button>
    <button class="emo-btn" data-emo=":(">😢</button>
    <button class="emo-btn" data-emo=":P">😛</button>
    <button class="emo-btn" data-emo="(L)">❤️</button>
    <button class="emo-btn" data-emo=":O">😮</button>
    <button class="emo-btn" data-emo="(Y)">👍</button>
    <button class="emo-btn" data-emo=":$">😳</button>
    <button class="emo-btn" data-emo="(A)">😇</button>
    <button class="emo-btn" data-emo="(6)">😈</button>
    <button class="emo-btn" data-emo="(*)">⭐</button>
    <button class="emo-btn" data-emo="(#)">☀️</button>
    <button class="emo-btn" data-emo="(8)">🎵</button>
    <button class="emo-btn" data-emo="(C)">☕</button>
    <button class="emo-btn" data-emo=":'(">😂</button>
</div>
                </div>

                <!-- Caja de texto para escribir -->
                <div class="chat-input-area">
                    <textarea id="messageInput" placeholder="Escribí un mensaje aquí..."></textarea>
                    <button id="sendBtn" class="send-btn">Enviar</button>
                </div>
            </div>

        </div>
    </div>

    <!-- Script conectado a Socket.io -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const loginScreen = document.getElementById('loginScreen');
        const msnWindow = document.getElementById('msnWindow');
        const nombreInput = document.getElementById('nombreInput');
        const loginBtn = document.getElementById('loginBtn');
        const myDisplayName = document.getElementById('myDisplayName');
        
        const windowBox = document.getElementById('msnWindow');
        const btnZumbido = document.getElementById('btnZumbido');
        const sendBtn = document.getElementById('sendBtn');
        const messageInput = document.getElementById('messageInput');
        const chatMessages = document.getElementById('chatMessages');

        let miNombre = "";

        // Función para reproducir el zumbido con el sintetizador interno del navegador
        function reproducirSonidoZumbido() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'square';
                osc.frequency.setValueAtTime(440, audioCtx.currentTime); 
                osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.1);
                osc.frequency.setValueAtTime(440, audioCtx.currentTime + 0.2);

                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            } catch (e) {
                console.log("Error al reproducir audio WebAPI:", e);
            }
        }

        // Lógica del menú de Emoticones
        const btnEmoticons = document.getElementById('btnEmoticons');
        const emoticonMenu = document.getElementById('emoticonMenu');

        btnEmoticons.addEventListener('click', (e) => {
            e.stopPropagation();
            emoticonMenu.classList.toggle('hidden');
        });

        document.addEventListener('click', () => {
            emoticonMenu.classList.add('hidden');
        });

        emoticonMenu.addEventListener('click', (e) => {
            e.stopPropagation();
        });

        document.querySelectorAll('.emo-btn').forEach(button => {
            button.addEventListener('click', () => {
                const codigoEmo = button.getAttribute('data-emo');
                messageInput.value += " " + codigoEmo + " ";
                messageInput.focus();
                emoticonMenu.classList.add('hidden');
            });
        });

        function parsearEmoticones(texto) {
    return texto
        .replace(/:\)/g, '😊')
        .replace(/:D/g, '😃')
        .replace(/;\)/g, '😉')
        .replace(/:\(/g, '😢')
        .replace(/:P/g, '😛')
        .replace(/\(L\)/gi, '❤️')
        .replace(/:O/g, '😮')
        .replace(/\(Y\)/gi, '👍')
        .replace(/:\$/g, '😳')
        .replace(/\(A\)/gi, '😇')
        .replace(/\(6\)/g, '😈')
        .replace(/\(\*\)/g, '⭐')
        .replace(/\(#\)/g, '☀️')
        .replace(/\(8\)/g, '🎵')
        .replace(/\(C\)/gi, '☕')
        .replace(/:'\(/g, '😂');
}

        function iniciarSesion()  {
            const texto = nombreInput.value.trim();
            if(!texto) {
                alert("¡Ponete un nombre che!");
                return;
            }

            miNombre = texto;
            myDisplayName.innerText = miNombre;

            loginScreen.classList.add('hidden');
            msnWindow.classList.remove('hidden');
        }

        loginBtn.addEventListener('click', iniciarSesion);
        nombreInput.addEventListener('keydown', (e) => {
            if(e.key === 'Enter') iniciarSesion();
        });

        // Botón Zumbido
        btnZumbido.addEventListener('click', () => {
            socket.emit('enviar_zumbido', miNombre);
        });

        // Recibir zumbido
        socket.on('recibir_zumbido', (usuarioQueManda) => {
            windowBox.classList.add('shake');
            reproducirSonidoZumbido();

            const div = document.createElement('div');
            div.classList.add('msg', 'system');
            div.innerHTML = `<span>⚡ <b>¡${usuarioQueManda || "Alguien"} te ha enviado un zumbido!</b></span>`;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            setTimeout(() => {
                windowBox.classList.remove('shake');
            }, 500);
        });

        // Enviar mensaje
        function enviarMensaje() {
            const texto = messageInput.value.trim();
            if(!texto) return;

            socket.emit('chat_message', { usuario: miNombre, texto: texto });
            messageInput.value = '';
        }

        sendBtn.addEventListener('click', enviarMensaje);
        messageInput.addEventListener('keydown', (e) => {
            if(e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                enviarMensaje();
            }
        });

        // Notificaciones emergentes (Toast)
        const msnToast = document.getElementById('msnToast');
        const toastUser = document.getElementById('toastUser');
        const toastMessage = document.getElementById('toastMessage');
        let toastTimeout;

        function mostrarNotificacion(usuario, texto) {
            toastUser.textContent = usuario;
            toastMessage.textContent = texto;
            
            msnToast.classList.remove('hidden');
            clearTimeout(toastTimeout);

            toastTimeout = setTimeout(() => {
                msnToast.classList.add('hidden');
            }, 4000);
        }

        // Recibir mensajes (Unificado con la ventana emergente)
        socket.on('chat_message', (data) => {
            const div = document.createElement('div');
            const esMio = data.usuario === miNombre;
            
            div.classList.add('msg', esMio ? 'sent' : 'received');
            
            const textoConEmojis = parsearEmoticones(data.texto);
            div.innerHTML = `<b>${data.usuario} dice:</b><p>${textoConEmojis}</p>`;
            
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            // Si el mensaje es de otra persona, mostramos el cartelito
            if (!esMio) {
                mostrarNotificacion(data.usuario, data.texto);
            }
        });

        // Gestión unificada de Perfil (PC y Celular sincronizados)
        const statusSelect = document.getElementById('statusSelect');
        const personalMsgInput = document.getElementById('personalMsgInput');
        const statusSelectMobile = document.getElementById('statusSelectMobile');
        const personalMsgInputMobile = document.getElementById('personalMsgInputMobile');

        function actualizarMiPerfil() {
            const estado = statusSelect.value || statusSelectMobile.value;
            const frase = personalMsgInput.value.trim() || personalMsgInputMobile.value.trim();
            
            if(statusSelect) statusSelect.value = estado;
            if(statusSelectMobile) statusSelectMobile.value = estado;
            if(personalMsgInput) personalMsgInput.value = frase;
            if(personalMsgInputMobile) personalMsgInputMobile.value = frase;

            socket.emit('actualizar_perfil', { estado, frase });
        }

        if(statusSelect) statusSelect.addEventListener('change', actualizarMiPerfil);
        if(statusSelectMobile) statusSelectMobile.addEventListener('change', actualizarMiPerfil);
        
        if(personalMsgInput) {
            personalMsgInput.addEventListener('change', actualizarMiPerfil);
            personalMsgInput.addEventListener('keydown', (e) => {
                if(e.key === 'Enter') personalMsgInput.blur();
            });
        }
        
        if(personalMsgInputMobile) {
            personalMsgInputMobile.addEventListener('change', actualizarMiPerfil);
            personalMsgInputMobile.addEventListener('keydown', (e) => {
                if(e.key === 'Enter') personalMsgInputMobile.blur();
            });
        }
    </script>
</body>
</html>
